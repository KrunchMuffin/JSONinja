name: Bug report
description: Something doesn't work or the app crashes
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem! Please make sure you're on the [latest release](https://github.com/KrunchMuffin/JSONinja/releases/latest) first. Security problems should be [reported privately](https://github.com/KrunchMuffin/JSONinja/security/advisories/new) instead.
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown in Help > About JSONinja (or on the installer file name).
      placeholder: "2.0.0"
    validations:
      required: true
  - type: dropdown
    id: build
    attributes:
      label: Which download?
      options:
        - Windows installer
        - Windows portable exe
        - macOS DMG
        - Linux AppImage
        - Linux deb/rpm
        - Built from source
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and version
      placeholder: "Windows 11 Pro 24H2 (build 26100)"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: If it's specific to a file, attach it or paste the smallest part that shows the problem. Remove anything private first.
      placeholder: |
        1. Open a file containing ...
        2. Click ...
        3. See ...
  - type: textarea
    id: crash-details
    attributes:
      label: Crash details (Windows)
      description: |
        If the app crashes or won't start, open **Event Viewer > Windows Logs > Application** and paste the **Application Error** entry for jsoninja.exe from the time of the crash.
      render: text
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, file size, theme and settings in use, etc.
