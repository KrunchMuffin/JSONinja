name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v2.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.info.outputs.tag }}
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract changelog for this version
        id: info
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          # Everything between this version's heading and the next one
          awk -v ver="[${TAG#v}]" '
            /^## \[/ { if (found) exit; if (index($0, ver)) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > release_notes.md
          [ -s release_notes.md ] || echo "Release ${TAG}" > release_notes.md

      # Reuses the release if one already exists, so a failed build can be re-run
      - name: Create draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.info.outputs.tag }}
        run: |
          find_release() {
            gh api "repos/${{ github.repository }}/releases" --jq ".[] | select(.tag_name == \"$TAG\") | .id"
          }
          ID=$(find_release)
          if [ -z "$ID" ]; then
            # Take the id from the response: a new draft can take a moment to appear in the list
            ID=$(gh api -X POST "repos/${{ github.repository }}/releases" \
              -f tag_name="$TAG" -f name="JSONinja $TAG" -f target_commitish="$GITHUB_SHA" \
              -F draft=true -F body=@release_notes.md --jq .id)
          fi
          if [ -z "$ID" ]; then
            echo "::error::Could not find or create the release for $TAG"
            exit 1
          fi
          echo "id=${ID}" >> "$GITHUB_OUTPUT"

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm ci

      # Signs the update files and uploads latest.json, which installed copies check for updates
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: --config src-tauri/tauri.release.conf.json ${{ matrix.args }}

      # The bare exe runs without installing, so ship it as the portable build
      - name: Upload Windows portable exe
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          PORTABLE="JSONinja-Portable-v${VERSION}-x64.exe"
          cp src-tauri/target/release/jsoninja.exe "$PORTABLE"
          gh release upload "${{ needs.create-release.outputs.tag }}" "$PORTABLE" --clobber
