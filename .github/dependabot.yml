version: 2
updates:
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    groups:
      # Tauri crates have to move together
      tauri:
        patterns:
          - "tauri*"
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # The CLI should stay on the same minor version as the tauri crate
      tauri:
        patterns:
          - "@tauri-apps/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
